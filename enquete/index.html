<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Geef je feedback over Moonshot 2026.">
<title>Moonshot 2026 · Eventenquête</title>
<link rel="icon" href="./mark.jpg">
<link rel="stylesheet" href="./style.css">
<script src="./app.js" defer></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><img src="./mark.jpg" alt=""><span>MOONSHOT <small>2026</small></span></div>
    <nav class="languages" aria-label="Taal">
      <button type="button" data-language="nl" lang="nl" aria-label="Nederlands" aria-pressed="true">NL</button>
      <button type="button" data-language="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button>
      <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title">Hoe was jouw Moonshot?</h1>
        <p id="intro"></p>
        <p class="meta" id="meta"></p>
      </div>
    </section>
    <form id="survey">
      <div id="questions"></div>
      <div class="actions">
        <p id="error" role="alert" hidden></p>
        <button class="primary" id="submit" type="submit"></button>
      </div>
    </form>
    <section class="card success" id="success" hidden tabindex="-1">
      <span class="check" aria-hidden="true">✓</span>
      <h2 id="thanks"></h2><p id="received"></p>
    </section>
  </main>
  <footer>MOONSHOT 2026 <span>·</span> PROXIMUS SME</footer>
</div>
</body>
</html>
